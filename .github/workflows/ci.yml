name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  frontend:
    strategy:
      matrix:
        app: [frontend, frontend-portal]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend unit tests (Vitest)
        run: npm run test:run

      - name: Frontend build
        run: npm run build

      # Fase 6 (0.9.1, audit 2026-08-19): scan CVE in pipeline. Fallisce la
      # build su qualunque vulnerabilità nota nelle dipendenze di produzione
      # (--omit=dev: i tool di build/test locali non finiscono in un
      # bundle servito, e tenerli fuori evita falsi allarmi su vitest/vite
      # che cambiano spesso e non sono mai eseguiti in produzione), TRANNE
      # l'eccezione nota e già accettata: quill (1 LOW, nessuna versione
      # corretta disponibile a monte — mitigata con formats: allowlist,
      # vedi RichEditor.tsx). Qualunque altra vulnerabilità fa fallire la CI.
      - name: npm audit (CVE scan, dipendenze di produzione)
        run: |
          npm audit --omit=dev --json > audit-report.json || true
          python3 -c "
          import json, sys
          ALLOWED = {'quill'}
          d = json.load(open('audit-report.json'))
          unexpected = {k: v['severity'] for k, v in d.get('vulnerabilities', {}).items() if k not in ALLOWED}
          if unexpected:
              print('Vulnerabilita\' NON in allowlist trovate:', unexpected)
              sys.exit(1)
          print('OK: nessuna vulnerabilita\' oltre alle eccezioni note (', ALLOWED, ')')
          "

      # SBOM in formato CycloneDX, un artifact per app frontend.
      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.app }}
          path: ${{ matrix.app }}/sbom.cdx.json
          retention-days: 90

  backend:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.dev.yml
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose $COMPOSE_FILES build

      - name: Static type check (mypy)
        run: docker compose $COMPOSE_FILES run --rm backend python -m mypy --config-file mypy.ini .

      # Fase 6 (0.9.1, audit 2026-08-19): scan CVE sulle dipendenze Python
      # pinnate/hashate (backend/requirements.txt, archie-fase6). Gira
      # sull'host CI, non nel container, per non appesantire l'immagine
      # runtime con un tool che serve solo in CI.
      - name: Set up Python (per pip-audit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip-audit (CVE scan backend)
        run: |
          pip install --quiet pip-audit
          pip-audit -r backend/requirements.txt

      # SBOM in formato CycloneDX per le dipendenze Python.
      - name: Generate SBOM (CycloneDX)
        run: |
          pip install --quiet cyclonedx-bom
          cyclonedx-py requirements backend/requirements.txt --output-file backend/sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: backend/sbom.cdx.json
          retention-days: 90

      - name: Start database
        run: docker compose $COMPOSE_FILES up -d db redis

      - name: Wait for db
        run: |
          for i in {1..30}; do
            if docker compose $COMPOSE_FILES exec -T db pg_isready -U "inventory_app" -d "inventory_app"; then
              exit 0
            fi
            sleep 2
          done
          echo "DB not ready" >&2
          docker compose $COMPOSE_FILES logs db redis
          exit 1

      - name: Django checks + migrations check + migration plan
        run: |
          docker compose $COMPOSE_FILES run --rm backend python manage.py check
          docker compose $COMPOSE_FILES run --rm backend python manage.py makemigrations --check --dry-run
          docker compose $COMPOSE_FILES run --rm backend python manage.py migrate --plan

      - name: Run backend tests (pytest)
        run: |
          docker compose $COMPOSE_FILES run --rm backend python manage.py migrate
          docker compose $COMPOSE_FILES run --rm backend pytest -q

      - name: Tear down
        if: always()
        run: docker compose $COMPOSE_FILES down -v
