{% comment %}Pulsante "a prova di Outlook". Parametri: label, url (percorso dell'app, es. /issues?open=), id (facoltativo, accodato a url), ghost (secondario).{% endcomment %}<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="display:inline-table;margin:0 8px 8px 0;"><tr><td bgcolor="{% if ghost %}#ffffff{% else %}#1f6b5c{% endif %}" style="border-radius:6px;background-color:{% if ghost %}#ffffff{% else %}#1f6b5c{% endif %};border:1px solid {% if ghost %}#b9c7c3{% else %}#1f6b5c{% endif %};mso-padding-alt:8px 14px;"><a href="{{ app_url }}{{ url }}{% if id %}{{ id }}{% endif %}" style="display:inline-block;padding:7px 14px;font-size:13px;line-height:18px;font-weight:600;color:{% if ghost %}#15201e{% else %}#ffffff{% endif %};text-decoration:none;border-radius:6px;">{{ label }}</a></td></tr></table>
