{% extends base_template %}
{% block content %}
<p>Ciao {{ nome_utente }},</p>
<p>È stata aperta una nuova issue:</p>
<p style="margin:20px 0;padding:16px;background-color:#f4f6f5;border-radius:6px;">
  <strong>{{ issue_title }}</strong><br>
  <span style="color:#6b7280;">Cliente: {{ customer_name }} · Priorità: {{ priority_label }}</span>
  {% if description %}<br><br>{{ description }}{% endif %}
</p>
<p>Accedi ad ARCHIE per maggiori dettagli.</p>
{% endblock %}
