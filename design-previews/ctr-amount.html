<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contratto · card Importo · ARCHIE</title>
<style>
@font-face { font-family: "Geist"; src: url("fonts/Geist-300_800-normal.woff2") format("woff2"); font-weight: 300 800; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("fonts/GeistMono-400_600-normal.woff2") format("woff2"); font-weight: 400 600; font-display: swap; }
:root {
  color-scheme: light;
  --primary: #1f6b5c; --primary-ink: #fff; --bg: #f4f7f6; --surface: #fff; --surface-2: #f5f8f7; --border: #d5dedb; --border-strong: #b9c7c3;
  --text: #15201e; --muted: #5b6b67; --faint: #7a8a86; --field: #e2f0eb; --track: #e6ecea; --warning: #9a5b00;
  --focus: 0 0 0 3px rgb(31 107 92 / .28); --shadow: 0 12px 32px -12px rgb(16 40 34 / .22), 0 2px 6px rgb(16 40 34 / .06);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --primary: #5fb8a3; --primary-ink: #0b1513; --bg: #141c1b; --surface: #151e1c; --surface-2: #1a2523; --border: #2a3734; --border-strong: #3b4c48;
  --text: #e4ecea; --muted: #93a4a0; --faint: #7d8e8a; --field: #183a33; --track: #24302e; --warning: #e0a43a;
  --focus: 0 0 0 3px rgb(95 184 163 / .35); --shadow: 0 16px 40px -12px rgb(0 0 0 / .6);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Geist, system-ui, sans-serif; }
.wrap { max-width: 800px; margin: 0 auto; padding: 28px 16px 120px; display: grid; gap: 16px; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
.card h2 { margin: 0 0 14px; font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.card h2 .end { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.big { font-size: 28px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.track { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; display: flex; }
.track i { display: block; height: 100%; background: var(--primary); border-radius: 4px 0 0 4px; }
.legend { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.legend b { color: var(--text); font-weight: 600; }
/* A */
.a-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.a-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.a-stats div + div { padding-left: 16px; border-left: 1px solid var(--border); }
.a-stats small { display: block; font-size: 12px; color: var(--muted); } .a-stats b { font-size: 16px; font-weight: 650; }
.a-stats span { display: block; font-size: 11.5px; color: var(--faint); }
/* B */
.b-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: end; margin-bottom: 14px; }
.bills { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.bills li { display: grid; grid-template-columns: 22px 120px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; font-size: 13px; }
.bills li + li { border-top: 1px solid var(--border); }
.bills .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--border-strong); justify-self: center; }
.bills li.done .dot { background: var(--primary); border-color: var(--primary); }
.bills li.next { background: var(--field); } .bills li.next .dot { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent); }
.bills li.done { color: var(--muted); }
.bills .tag { font-size: 11.5px; font-weight: 600; color: var(--primary); }
.bills .amt { font-weight: 600; text-align: right; }
.b-foot { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; color: var(--muted); } .b-foot b { color: var(--text); }
/* C */
.c-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; }
.hero { background: var(--field); border-radius: 10px; padding: 16px 18px; display: grid; gap: 10px; align-content: start; }
.hero .lbl { font-size: 12px; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: .06em; }
.tiles { display: grid; gap: 8px; }
.tile { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 10px; }
.tile small { font-size: 12px; color: var(--muted); } .tile b { font-size: 15px; font-weight: 650; } .tile span { grid-column: 1 / -1; font-size: 11.5px; color: var(--faint); }
/* barra comandi */
.pv { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; padding: 6px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); z-index: 10; font-size: 12.5px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 24px); }
.pv a, .pv button { height: 28px; padding: 0 10px; border-radius: 6px; border: 0; background: none; color: var(--muted); font: inherit; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.pv button[aria-pressed="true"] { background: var(--field); color: var(--text); font-weight: 600; }
.pv button:focus-visible, .pv a:focus-visible { outline: none; box-shadow: var(--focus); }
.pv .sep { width: 1px; height: 18px; background: var(--border); }
@media (max-width: 640px) { .c-grid { grid-template-columns: minmax(0, 1fr); } .a-stats { grid-template-columns: minmax(0, 1fr); gap: 10px; } .a-stats div + div { padding-left: 0; border-left: 0; } .bills li { grid-template-columns: 22px minmax(0, 1fr) auto; } .bills .tagc { display: none; } }
</style>
</head>
<body>
<div class="wrap" data-root></div>
<div class="pv" role="toolbar" aria-label="Controlli anteprima">
  <a href="index.html">‹ Indice</a><span class="sep"></span>
  <button data-v="a">A · Riepilogo e avanzamento</button><button data-v="b">B · Piano delle fatture</button><button data-v="c">C · Tessere</button>
  <span class="sep"></span>
  <button data-k="0">Annuale 14 mesi</button><button data-k="1">Trimestrale 36 mesi</button><button data-k="2">Una tantum</button>
  <span class="sep"></span><button data-theme>Tema</button>
</div>
<script>
(() => {
  const TODAY = new Date('2026-11-21')
  const K = [
    { value: 58000, start: '2025-09-14', end: '2026-11-08', freq: 'annuale', label: 'annuale', per: 12 },
    { value: 129600, start: '2025-03-01', end: '2028-02-29', freq: 'trimestrale', label: 'trimestrale', per: 3 },
    { value: 18400, start: '2026-06-01', end: '2027-05-31', freq: 'una_tantum', label: 'una tantum', per: 0 },
  ]
  const st = { v: 'a', k: 0 }
  try { Object.assign(st, JSON.parse(localStorage.getItem('archie-preview-ctr-amount') || '{}')) } catch (e) { /* niente */ }
  const eur = (n, d = 2) => n.toLocaleString('it-IT', { style: 'currency', currency: 'EUR', minimumFractionDigits: d, maximumFractionDigits: d })
  const dt = (d) => d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' })
  const addM = (d, m) => { const x = new Date(d); x.setMonth(x.getMonth() + m); return x }
  const months = (a, b) => { const s = new Date(a), e = new Date(b); return Math.max(1, (e.getFullYear() - s.getFullYear()) * 12 + e.getMonth() - s.getMonth() + (e.getDate() >= s.getDate() ? 1 : 0)) }

  const calc = (c) => {
    const m = months(c.start, c.end), s = new Date(c.start), e = new Date(c.end)
    const perMonth = c.value / m
    const elapsed = Math.min(1, Math.max(0, (TODAY - s) / (e - s)))
    const bills = []
    if (!c.per) bills.push({ date: s, amount: c.value, months: m })
    else for (let i = 0; i < m; i += c.per) { const n = Math.min(c.per, m - i); bills.push({ date: addM(s, i), amount: perMonth * n, months: n }) }
    const nextIdx = bills.findIndex((b) => b.date > TODAY)
    return { m, perMonth, perYear: perMonth * 12, elapsed, matured: c.value * elapsed, bills, nextIdx }
  }

  const vA = (c, x) => `<section class="card"><h2>Importo</h2>
    <div class="a-top"><div><div class="big num">${eur(c.value)}</div><div class="small muted">su ${x.m} mesi · ${dt(new Date(c.start))} → ${dt(new Date(c.end))}</div></div>
      <div class="small muted" style="text-align:right">Fatturazione <b style="color:var(--text)">${c.label}</b><br>${x.bills.length} ${x.bills.length === 1 ? 'fattura' : 'fatture'}</div></div>
    <div class="track" role="img" aria-label="Maturato ${Math.round(x.elapsed * 100)}%"><i style="width:${x.elapsed * 100}%"></i></div>
    <div class="legend"><span>Maturato finora <b class="num">${eur(x.matured, 0)}</b> · ${Math.round(x.elapsed * 100)}%</span><span>Da maturare <b class="num">${eur(c.value - x.matured, 0)}</b></span></div>
    <div class="a-stats">
      <div><small>Al mese</small><b class="num">${eur(x.perMonth)}</b><span>media sul periodo</span></div>
      <div><small>All'anno</small><b class="num">${eur(x.perYear)}</b><span>12 mesi di contratto</span></div>
      <div><small>Per fattura</small><b class="num">${c.per ? eur(x.perMonth * c.per) : eur(c.value)}</b><span>${c.per ? `ogni ${c.per === 12 ? 'anno' : c.per === 3 ? 'trimestre' : 'mese'}` : 'unica'}</span></div>
    </div></section>`

  const vB = (c, x) => {
    const maxRows = 6
    const start = Math.max(0, Math.min((x.nextIdx < 0 ? x.bills.length : x.nextIdx) - 2, x.bills.length - maxRows))
    const shown = x.bills.slice(start, start + maxRows)
    return `<section class="card"><h2>Importo<span class="end">fatturazione ${c.label}</span></h2>
    <div class="b-head"><div><div class="big num">${eur(c.value)}</div><div class="small muted">su ${x.m} mesi · ${eur(x.perMonth)} al mese · ${eur(x.perYear)} all'anno</div></div></div>
    <ol class="bills" aria-label="Piano delle fatture">${start ? `<li class="done"><span></span><span class="small">${start} ${start === 1 ? 'fattura precedente' : 'fatture precedenti'}</span><span></span><span class="amt num small">${eur(x.bills.slice(0, start).reduce((s, b) => s + b.amount, 0))}</span></li>` : ''}
      ${shown.map((b, j) => { const i = start + j, cls = i === x.nextIdx ? 'next' : b.date <= TODAY ? 'done' : ''
        return `<li class="${cls}"><span class="dot" aria-hidden="true"></span><span class="num">${dt(b.date)}</span><span class="tagc">${cls === 'next' ? '<span class="tag">Prossima</span>' : cls === 'done' ? '<span class="small">emessa</span>' : `<span class="small muted">${b.months < (c.per || b.months) ? `${b.months} mesi, pro quota` : ''}</span>`}</span><span class="amt num">${eur(b.amount)}</span></li>` }).join('')}
      ${start + maxRows < x.bills.length ? `<li><span></span><span class="small muted">altre ${x.bills.length - start - maxRows}</span><span></span><span class="amt num small muted">${eur(x.bills.slice(start + maxRows).reduce((s, b) => s + b.amount, 0))}</span></li>` : ''}
    </ol>
    <div class="b-foot"><span>${x.bills.length} ${x.bills.length === 1 ? 'fattura' : 'fatture'} in tutto</span><span>Emesse <b class="num">${eur(x.bills.filter((b) => b.date <= TODAY).reduce((s, b) => s + b.amount, 0))}</b></span><span>Da emettere <b class="num">${eur(x.bills.filter((b) => b.date > TODAY).reduce((s, b) => s + b.amount, 0))}</b></span></div>
    <p class="note" style="margin-top:8px">Date stimate dall'inizio del contratto e dalla frequenza: Archie non conosce le fatture vere.</p></section>`
  }

  const vC = (c, x) => `<section class="card"><h2>Importo</h2><div class="c-grid">
    <div class="hero"><span class="lbl">Valore totale</span><div class="big num">${eur(c.value)}</div><div class="small muted">${x.m} mesi · fatturazione ${c.label}</div>
      <div><div class="track"><i style="width:${x.elapsed * 100}%"></i></div><div class="legend"><span>maturato <b class="num">${Math.round(x.elapsed * 100)}%</b></span><span>${dt(new Date(c.end))}</span></div></div></div>
    <div class="tiles">
      <div class="tile"><small>Al mese</small><b class="num">${eur(x.perMonth)}</b></div>
      <div class="tile"><small>All'anno</small><b class="num">${eur(x.perYear)}</b></div>
      <div class="tile"><small>Per fattura</small><b class="num">${c.per ? eur(x.perMonth * c.per) : eur(c.value)}</b><span>${x.bills.length} ${x.bills.length === 1 ? 'fattura' : 'fatture'}${x.nextIdx >= 0 ? ` · prossima il ${dt(x.bills[x.nextIdx].date)}` : ''}</span></div>
    </div></div></section>`

  const render = () => {
    const c = K[st.k], x = calc(c)
    document.querySelector('[data-root]').innerHTML = `<p class="note">Card «Importo» nel dettaglio del contratto (colonna principale, solo con il permesso sui valori). Oggi: 21 nov 2026.</p>${st.v === 'b' ? vB(c, x) : st.v === 'c' ? vC(c, x) : vA(c, x)}`
    document.querySelectorAll('[data-v]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === st.v)))
    document.querySelectorAll('[data-k]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.k) === st.k)))
    try { localStorage.setItem('archie-preview-ctr-amount', JSON.stringify(st)) } catch (e) { /* niente */ }
  }
  document.addEventListener('click', (e) => {
    const v = e.target.closest('[data-v]'); if (v) { st.v = v.dataset.v; render() }
    const k = e.target.closest('[data-k]'); if (k) { st.k = Number(k.dataset.k); render() }
    if (e.target.closest('[data-theme]')) { const h = document.documentElement; h.setAttribute('data-theme', h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark') }
  })
  render()
})()
</script>
</body>
</html>
