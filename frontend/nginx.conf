server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # index.html va sempre rivalidato: dopo un rilascio deve puntare ai nuovi
  # file in /assets/. Senza Cache-Control il browser lo teneva in cache "a
  # stima" e poteva caricare chunk non più esistenti (pagina bianca).
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # File con hash nel nome: immutabili. Se manca, 404 (non l'index.html,
  # che il browser rifiuterebbe come modulo JS).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API (così la UI chiama /api senza CORS)
  # Media/static in produzione non vengono serviti da Django (DEBUG=0),
  # quindi li inoltriamo al backend_nginx che li espone tramite alias.
  location /api/media/ {
    proxy_pass http://backend_nginx:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout  10s;
    proxy_send_timeout    130s;
    proxy_read_timeout    130s;
  }

  location /api/static/ {
    proxy_pass http://backend_nginx:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout  10s;
    proxy_send_timeout    130s;
    proxy_read_timeout    130s;
  }

  # NOTE: Drive downloads use X-Accel-Redirect which is handled by backend_nginx
  # (it has the internal /protected_media/ location + access rules for /api/media/drive/).
  # Therefore the whole /api/ namespace must pass through backend_nginx.
  location /api/ {
    proxy_pass http://backend_nginx:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeout allineati al --timeout 120 di gunicorn (+ margine di 10s).
    # Senza questi, nginx chiude la connessione dopo 60s di default
    # causando un 502 Bad Gateway su richieste lente (import, batch, ecc.).
    proxy_connect_timeout  10s;
    proxy_send_timeout    130s;
    proxy_read_timeout    130s;
  }
}

